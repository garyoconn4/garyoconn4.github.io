  position: relative; height: 100%; width: 100%; overflow: hidden; overflow-x: clip;
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 1rem; line-height: 1.45; font-weight: 500;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  font-variant-numeric: tabular-nums;
  container-type: inline-size; container-name: app;
}
:where(.st-root) *, :where(.st-root) *::before, :where(.st-root) *::after { box-sizing: border-box; }
:where(.st-root) :where(button, input, select, textarea) { font: inherit; color: inherit; }
:where(.st-root) :where(button) { cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }
:where(.st-root) :where(a) { color: var(--acc-text); }
.st-root :focus-visible { outline: 3px solid rgba(var(--acc-rgb), .7); outline-offset: 2px; border-radius: 10px; }
:where(.st-root) :where(h1, h2, h3) { font-family: var(--display); margin: 0; letter-spacing: -.02em; text-wrap: balance; }
:where(.st-root) :where(p) { margin: 0; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; letter-spacing: -.03em; }
.muted { color: var(--ink-3); }
.soft { color: var(--ink-2); }
.small { font-size: .9375rem; }
.tiny { font-size: .8125rem; }
.strong { font-weight: 700; }
.eyebrow { font-size: .75rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.row.top { align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 10px; }
.grow { flex: 1 1 auto; min-width: 0; }
.right { margin-left: auto; }
.center { text-align: center; }
.gap-4 { gap: 4px; } .gap-6 { gap: 6px; } .gap-14 { gap: 14px; } .gap-18 { gap: 18px; }
.mt-4 { margin-top: 4px; } .mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; } .mt-24 { margin-top: 24px; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hide { display: none !important; }
.ic { flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* --------------------------------------------------------------- the shell */
.st-scroll {
  position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px calc(env(safe-area-inset-bottom, 0px) + 116px);
  scroll-behavior: smooth;
}
.st-scroll.no-tabs { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 40px); }
.st-page { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.st-page.wide { max-width: 1120px; }
.sky {
  position: absolute; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(600px 380px at 85% -6%, rgba(var(--acc-rgb), .22), transparent 70%),
    radial-gradient(520px 420px at -10% 18%, rgba(var(--acc-rgb), .10), transparent 70%),
    radial-gradient(700px 500px at 50% 120%, rgba(124, 92, 255, .10), transparent 70%);
}
.st-root[data-theme="light"] .sky { opacity: .55; }
.st-scroll > * { position: relative; z-index: 1; }

/* header */
.topbar { display: flex; align-items: center; gap: 12px; min-height: 52px; }
.topbar h1 { font-size: 1.5rem; font-weight: 800; }
.topbar .title { min-width: 0; }
.iconbtn {
  width: 44px; height: 44px; border-radius: 14px; display: inline-grid; place-items: center; flex: none;
  background: var(--surface); border: 1px solid var(--line); color: var(--ink);
  transition: transform .15s var(--ease), background .2s;
}
.iconbtn:active { transform: scale(.94); }
.iconbtn.ghost { background: transparent; border-color: transparent; }
.avatar {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none;
  font-family: var(--display); font-weight: 800; font-size: 1.05rem; color: var(--acc-ink);
  background: linear-gradient(140deg, var(--acc), var(--acc-2)); box-shadow: var(--glow);
}
.avatar.sm { width: 34px; height: 34px; font-size: .85rem; }
.avatar.lg { width: 64px; height: 64px; font-size: 1.5rem; }

/* tab bar: a floating pill that never covers content */
.tabbar {
  position: absolute; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); z-index: 30;
  max-width: 520px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 6px;
  background: var(--tab); border: 1px solid var(--line-2); border-radius: 26px;
  box-shadow: 0 18px 40px -12px rgba(0, 0, 0, .55);
}
.tabbar button {
  min-height: 56px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: .72rem; font-weight: 700; color: var(--ink-3); transition: color .2s, background .25s var(--ease);
}
.tabbar button[aria-current="page"] { color: var(--acc-ink); background: linear-gradient(140deg, var(--acc), var(--acc-2)); box-shadow: var(--glow); }
.tabbar button .dot { position: absolute; transform: translate(12px, -14px); width: 9px; height: 9px; border-radius: 50%; background: var(--red); border: 2px solid var(--tab); }
.tabbar button .ic-wrap { position: relative; display: grid; place-items: center; }

/* ----------------------------------------------------------------- cards */
.card {
  position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 18px; box-shadow: var(--shadow); min-width: 0;
}
.st-root[data-theme="light"] .card { border-color: rgba(14, 20, 48, .07); }
.card.flat { box-shadow: none; }
.card.tight { padding: 14px; }
.card.hero { padding: 20px; overflow: hidden; }
.card.hero::before {
  content: ''; position: absolute; inset: -40% -20% auto auto; width: 300px; height: 260px; pointer-events: none;
  background: radial-gradient(closest-side, rgba(var(--acc-rgb), .35), transparent); filter: blur(4px);
}
.card.accent { background: linear-gradient(150deg, rgba(var(--acc-rgb), .28), rgba(var(--acc-rgb), .06) 60%), var(--surface); border-color: rgba(var(--acc-rgb), .35); }
.card h2 { font-size: 1.125rem; font-weight: 800; }
.card h3 { font-size: 1rem; font-weight: 800; }
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.card-head .link { margin-left: auto; font-size: .875rem; font-weight: 700; color: var(--acc-text); padding: 8px 4px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.grid2 > *, .grid3 > * { min-width: 0; }
@container app (max-width: 380px) { .grid3 { grid-template-columns: 1fr 1fr; } }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .big { font-size: 2.25rem; font-weight: 800; line-height: 1; }
.stat .label { font-size: .8125rem; color: var(--ink-3); font-weight: 700; }

/* stagger in from below, from a visible resting state when motion is off */
.rise { animation: rise .6s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: none; } }
.fade { animation: fade .4s ease both; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.pop { animation: pop .45s var(--ease) both; }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }

/* --------------------------------------------------------------- buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 50px; padding: 0 22px; border-radius: 999px;
  font-family: var(--display); font-weight: 800; font-size: 1rem; letter-spacing: -.01em;
  background: var(--surface-2); color: var(--ink); border: 1px solid var(--line);
  transition: transform .15s var(--ease), box-shadow .2s, background .2s, opacity .2s; white-space: nowrap;
}
.btn:active { transform: scale(.97); }
.btn.primary { color: var(--acc-ink); background: linear-gradient(135deg, var(--acc), var(--acc-2)); border: 0; box-shadow: var(--glow); }
.btn.go { color: #06210F; background: linear-gradient(135deg, #3BE08F, #22C27A); border: 0; box-shadow: 0 10px 30px -12px rgba(34, 194, 122, .8); }
.btn.danger { color: #fff; background: var(--red); border: 0; }
.btn.ghost { background: transparent; border-color: var(--line-2); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--acc-text); padding: 0 12px; }
.btn.block { width: 100%; }
.btn.sm { min-height: 40px; padding: 0 16px; font-size: .9rem; }
.btn.lg { min-height: 60px; font-size: 1.125rem; padding: 0 28px; }
.btn:disabled { opacity: .45; pointer-events: none; }
.btn .ic { flex: none; }
.pillset { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--line); font-weight: 700; font-size: .875rem; color: var(--ink-2); white-space: nowrap;
}
.chip[aria-pressed="true"], .chip.on { background: rgba(var(--acc-rgb), .18); border-color: rgba(var(--acc-rgb), .55); color: var(--ink); }
.chip.sm { min-height: 28px; padding: 0 10px; font-size: .78rem; }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: .75rem; font-weight: 800; background: var(--surface-2); color: var(--ink-2); }
.tag.green { background: var(--green-soft); color: var(--green); }
.tag.amber { background: var(--amber-soft); color: var(--amber); }
.tag.red { background: var(--red-soft); color: var(--red); }
.tag.acc { background: rgba(var(--acc-rgb), .16); color: var(--acc-text); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; }
.dot.green { background: var(--green); box-shadow: 0 0 0 4px var(--green-soft); }
.dot.amber { background: var(--amber); box-shadow: 0 0 0 4px var(--amber-soft); }
.dot.red { background: var(--red); box-shadow: 0 0 0 4px var(--red-soft); }
.dot.none { background: var(--surface-3); }

.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 4px; gap: 4px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--line); }
.seg button { min-height: 40px; padding: 0 14px; border-radius: 12px; font-weight: 800; font-size: .875rem; color: var(--ink-3); }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--ink); box-shadow: 0 4px 12px -6px rgba(0, 0, 0, .5); }
.st-root[data-theme="light"] .seg button[aria-pressed="true"] { background: #fff; }

/* ------------------------------------------------------------ list rows */
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-top: 1px solid var(--line); min-height: 56px; width: 100%; text-align: left; }
.li:first-child { border-top: 0; }
.li .meta { font-size: .8125rem; color: var(--ink-3); font-weight: 600; }
.li-btn { transition: background .2s; border-radius: 14px; padding-left: 8px; padding-right: 8px; margin: 0 -8px; width: calc(100% + 16px); }
.li-btn:active { background: var(--surface-2); }
.sub-ic { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; flex: none; color: #fff; }
.sub-ic.sm { width: 32px; height: 32px; border-radius: 10px; }
.sub-ic.lg { width: 56px; height: 56px; border-radius: 18px; }

/* --------------------------------------------------------------- inputs */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > .label { font-size: .8125rem; font-weight: 800; color: var(--ink-2); letter-spacing: .01em; }
.input, .select, .textarea {
  width: 100%; min-height: 52px; padding: 12px 16px; border-radius: 16px; font-size: 1rem; font-weight: 600;
  background: var(--surface-2); border: 1.5px solid var(--line); color: var(--ink); outline: none; transition: border-color .2s, background .2s;
}
.textarea { min-height: 110px; resize: vertical; line-height: 1.5; }
.input:focus, .select:focus, .textarea:focus { border-color: rgba(var(--acc-rgb), .8); background: var(--surface); }
.input::placeholder, .textarea::placeholder { color: var(--ink-3); opacity: .8; }
.select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 22px) 52%, calc(100% - 16px) 52%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 40px; }
.check { display: flex; align-items: center; gap: 12px; min-height: 48px; font-weight: 700; }
.check input { width: 24px; height: 24px; accent-color: var(--acc); }
.range { width: 100%; accent-color: var(--acc); height: 32px; }
.switch { position: relative; width: 52px; height: 32px; border-radius: 999px; background: var(--surface-3); transition: background .2s; flex: none; }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .25s var(--ease); box-shadow: 0 2px 6px rgba(0, 0, 0, .3); }
.switch[aria-checked="true"] { background: var(--acc); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }

/* --------------------------------------------------------------- rings */
.ring { position: relative; display: inline-grid; place-items: center; flex: none; }
.ring svg { transform: rotate(-90deg); overflow: visible; }
.ring .track { stroke: var(--surface-3); }
.ring .arc { transition: stroke-dashoffset 1.4s var(--ease); filter: drop-shadow(0 0 6px rgba(var(--acc-rgb), .55)); }
.ring .inner { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.bar { height: 10px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--acc), var(--acc-2)); transition: width 1.3s var(--ease); box-shadow: 0 0 14px rgba(var(--acc-rgb), .7); }
.bar.thin { height: 6px; }
.bar.fat { height: 14px; }
.bar.green > i { background: linear-gradient(90deg, #1FAE6D, #3BE08F); box-shadow: none; }

/* ----------------------------------------------------------- Study Next */
.sn-card { padding: 18px 18px 8px; }
.sn-item { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.sn-item:first-of-type { border-top: 0; }
.sn-rank { font-family: var(--display); font-weight: 800; font-size: .8rem; color: var(--ink-3); }
.sn-topic { font-weight: 800; font-size: 1.02rem; line-height: 1.25; }
.sn-why { font-size: .875rem; color: var(--ink-2); margin-top: 3px; line-height: 1.35; }
.start-btn {
  min-height: 48px; min-width: 84px; padding: 0 18px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; justify-content: center;
  font-family: var(--display); font-weight: 800; color: var(--acc-ink); background: linear-gradient(135deg, var(--acc), var(--acc-2)); box-shadow: var(--glow);
  transition: transform .15s var(--ease);
}
.start-btn:active { transform: scale(.95); }
.sn-item:first-of-type .start-btn { min-height: 52px; animation: breathe 2.8s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { box-shadow: 0 8px 26px -10px rgba(var(--acc-rgb), .7); } 50% { box-shadow: 0 8px 36px -6px rgba(var(--acc-rgb), .95); } }

/* ---------------------------------------------------------------- hero */
.greet { font-family: var(--display); font-size: 1.75rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
.greet span { background: linear-gradient(120deg, var(--acc-text), var(--acc-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.countdown { display: flex; align-items: flex-end; gap: 14px; }
.countdown .big { font-size: 3.5rem; font-weight: 800; line-height: .9; }
.countdown .what { font-weight: 800; font-size: 1rem; }
.lc-strip { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 16px; background: var(--surface-2); margin-top: 14px; }
.hours-hero { display: flex; align-items: center; gap: 18px; }
.hours-hero .big { font-size: 3rem; font-weight: 800; line-height: 1; }
.flame-wrap { display: flex; align-items: center; gap: 12px; }
.flame { display: block; transform-origin: 50% 90%; animation: flick 1.6s ease-in-out infinite; }
.flame .f2 { animation: flick2 1.1s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes flick { 0%, 100% { transform: scale(1) rotate(-1deg); } 50% { transform: scale(1.05, .97) rotate(1.5deg); } }
@keyframes flick2 { 0%, 100% { transform: scale(1); } 50% { transform: scale(.92, 1.06); } }
.flame.cold { animation: none; filter: grayscale(1) opacity(.45); }
.points-big { font-size: 2.75rem; font-weight: 800; line-height: 1; }
.delta { display: inline-flex; align-items: center; gap: 3px; font-weight: 800; font-size: .875rem; padding: 3px 9px; border-radius: 999px; }
.delta.up { color: var(--green); background: var(--green-soft); }
.delta.down { color: var(--red); background: var(--red-soft); }
.delta.flat { color: var(--ink-3); background: var(--surface-2); }
.xpbar-wrap { display: flex; flex-direction: column; gap: 8px; }
.lvl-badge { display: inline-grid; place-items: center; width: 52px; height: 52px; border-radius: 16px; font-family: var(--display); font-weight: 800; font-size: 1.35rem; color: var(--acc-ink); background: linear-gradient(140deg, var(--acc), var(--acc-2)); box-shadow: var(--glow); flex: none; transform: rotate(-4deg); }

/* today's plan */
.plan-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); min-height: 60px; }
.plan-item:first-child { border-top: 0; }
.tick {
  width: 34px; height: 34px; border-radius: 11px; border: 2px solid var(--line-2); display: grid; place-items: center; flex: none;
  transition: background .25s var(--ease), border-color .25s, transform .2s var(--ease); color: transparent;
}
.tick.on { background: var(--green); border-color: var(--green); color: #fff; transform: scale(1.06); }
.tick.on svg path { stroke-dasharray: 24; stroke-dashoffset: 0; animation: draw .4s var(--ease) both; }
@keyframes draw { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
.plan-item.done .grow > .strong { text-decoration: line-through; text-decoration-color: var(--ink-3); color: var(--ink-3); }
.src { font-size: .72rem; font-weight: 800; color: var(--acc-text); }

.xp-float {
  position: absolute; z-index: 90; pointer-events: none; font-family: var(--display); font-weight: 800; font-size: 1.1rem;
  color: #FFD25E; text-shadow: 0 2px 10px rgba(0, 0, 0, .5); animation: floatup 1.3s var(--ease) forwards;
}
@keyframes floatup { 0% { transform: translateY(0) scale(.8); opacity: 0; } 15% { opacity: 1; transform: translateY(-8px) scale(1.1); } 100% { transform: translateY(-70px) scale(1); opacity: 0; } }

/* donut */
.donut-wrap { display: flex; align-items: center; gap: 18px; }
.legend { display: grid; gap: 8px; font-size: .875rem; font-weight: 700; }
.legend .row { gap: 8px; }

/* -------------------------------------------------------- weak spots map */
.ws-subject { padding: 14px; }
.ws-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.ws-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.ws-tile {
  position: relative; min-height: 58px; padding: 8px 9px; border-radius: 12px; font-size: .74rem; font-weight: 700; line-height: 1.2; text-align: left;
  color: #fff; display: flex; align-items: flex-end; overflow: hidden; transition: transform .2s var(--ease), opacity .3s;
}
.ws-tile:active { transform: scale(.96); }
.ws-tile.green { background: linear-gradient(150deg, #29C97F, #138A55); }
.ws-tile.amber { background: linear-gradient(150deg, #F7C24E, #C98A10); color: #2A1B00; }
.ws-tile.red { background: linear-gradient(150deg, #FF6B6B, #C93030); }
.ws-tile.none { background: var(--surface-3); color: var(--ink-2); border: 1.5px dashed var(--line-2); }
.ws-tile.faded { opacity: .42; filter: saturate(.55); }
.ws-tile .age { position: absolute; top: 6px; right: 7px; font-size: .64rem; opacity: .85; font-weight: 800; }
.ws-key { display: flex; flex-wrap: wrap; gap: 12px; font-size: .8rem; font-weight: 700; color: var(--ink-2); }
.ws-key i { display: inline-block; width: 14px; height: 14px; border-radius: 5px; vertical-align: -2px; margin-right: 6px; }

/* rating buttons (one tap) */
.rate-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.rate-btn { min-height: 92px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-family: var(--display); font-weight: 800; font-size: 1rem; border: 2px solid transparent; transition: transform .15s var(--ease); }
.rate-btn:active { transform: scale(.95); }
.rate-btn i { width: 26px; height: 26px; border-radius: 50%; }
.rate-btn.red { background: var(--red-soft); color: var(--red); } .rate-btn.red i { background: var(--red); }
.rate-btn.amber { background: var(--amber-soft); color: var(--amber); } .rate-btn.amber i { background: var(--amber); }
.rate-btn.green { background: var(--green-soft); color: var(--green); } .rate-btn.green i { background: var(--green); }
.rate-btn[aria-pressed="true"] { border-color: currentColor; }
.rag { display: inline-flex; gap: 4px; }
.rag button { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; border: 2px solid transparent; background: var(--surface-2); }
.rag button i { width: 14px; height: 14px; border-radius: 50%; }
.rag button[aria-pressed="true"] { border-color: currentColor; }
.rag .r { color: var(--red); } .rag .r i { background: var(--red); }
.rag .a { color: var(--amber); } .rag .a i { background: var(--amber); }
.rag .g { color: var(--green); } .rag .g i { background: var(--green); }

/* ---------------------------------------------------------------- planner */
.week-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day-pill { min-height: 66px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: var(--surface); border: 1px solid var(--line); font-weight: 800; }
.day-pill .dn { font-size: .7rem; color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; }
.day-pill .dd { font-family: var(--display); font-size: 1.15rem; }
.day-pill .dots { display: flex; gap: 3px; height: 6px; }
.day-pill .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--acc); }
.day-pill[aria-pressed="true"] { background: linear-gradient(150deg, var(--acc), var(--acc-2)); color: var(--acc-ink); border-color: transparent; box-shadow: var(--glow); }
.day-pill[aria-pressed="true"] .dn { color: inherit; opacity: .85; }
.day-pill[aria-pressed="true"] .dots i { background: var(--acc-ink); }
.day-pill.today:not([aria-pressed="true"]) { border-color: rgba(var(--acc-rgb), .6); }
.timeline { position: relative; margin-left: 46px; border-left: 1px solid var(--line); touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.timeline .hr { position: absolute; left: -46px; right: 0; font-size: .72rem; font-weight: 700; color: var(--ink-3); border-top: 1px dashed var(--line); padding-top: 2px; }
.timeline .hr span { display: inline-block; width: 40px; text-align: right; transform: translateY(-9px); background: var(--bg); padding-right: 4px; }
.blk {
  position: absolute; left: 8px; right: 6px; border-radius: 14px; padding: 8px 10px; overflow: hidden; font-size: .82rem; font-weight: 700; line-height: 1.25;
  display: flex; flex-direction: column; gap: 2px; text-align: left; transition: box-shadow .2s, transform .2s var(--ease);
}
.blk.commit { background: repeating-linear-gradient(135deg, var(--surface-2) 0 8px, var(--surface) 8px 16px); color: var(--ink-3); border: 1px solid var(--line); }
.blk.sess { color: #fff; box-shadow: 0 8px 22px -12px rgba(0, 0, 0, .7); touch-action: none; cursor: grab; }
.blk.sess.done { opacity: .62; }
.blk.sess.missed { background: var(--surface-2) !important; color: var(--ink-3); border: 1.5px dashed var(--line-2); }
.blk.sess.suggested { outline: 2px dashed rgba(255, 255, 255, .85); outline-offset: -4px; }
.blk.dragging { z-index: 20; transform: scale(1.03); box-shadow: 0 18px 40px -10px rgba(0, 0, 0, .8); cursor: grabbing; }
.now-line { position: absolute; left: -6px; right: 0; height: 2px; background: var(--red); z-index: 5; }
.now-line::before { content: ''; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--red); }
.wk-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wk-col { min-height: 150px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); padding: 6px; display: flex; flex-direction: column; gap: 5px; transition: background .2s, border-color .2s; }
.wk-col.drop { background: rgba(var(--acc-rgb), .15); border-color: rgba(var(--acc-rgb), .7); }
.wk-col .wk-h { text-align: center; font-size: .7rem; font-weight: 800; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; padding: 2px 0 4px; }
.wk-col .wk-h b { display: block; font-family: var(--display); font-size: 1rem; color: var(--ink); letter-spacing: 0; }
.wk-chip { border-radius: 9px; padding: 5px 6px; font-size: .68rem; font-weight: 800; color: #fff; line-height: 1.15; touch-action: none; cursor: grab; overflow: hidden; }
.wk-chip.done { opacity: .55; }
.wk-chip.suggested { outline: 1.5px dashed #fff; outline-offset: -3px; }
.wk-chip.missed { background: var(--surface-3) !important; color: var(--ink-3); }

/* ----------------------------------------------------------------- timer */
.timer-screen { position: absolute; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px calc(env(safe-area-inset-bottom, 0px) + 26px); background: radial-gradient(700px 600px at 50% 40%, rgba(var(--acc-rgb), .28), transparent 70%), var(--bg); }
.timer-screen.break { background: radial-gradient(700px 600px at 50% 40%, rgba(34, 194, 122, .26), transparent 70%), var(--bg); }
.timer-face { position: relative; display: grid; place-items: center; }
.timer-face .time { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.timer-face .digits { font-size: clamp(3.4rem, 17vw, 5.4rem); font-weight: 800; line-height: 1; }
.timer-face svg .arc { filter: drop-shadow(0 0 14px rgba(var(--acc-rgb), .8)); transition: stroke-dashoffset 1s linear; }
.timer-face.break svg .arc { filter: drop-shadow(0 0 14px rgba(34, 194, 122, .8)); }
.timer-ctrls { display: flex; gap: 14px; align-items: center; justify-content: center; }
.round-btn { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line-2); transition: transform .15s var(--ease); }
.round-btn.main { width: 92px; height: 92px; color: var(--acc-ink); background: linear-gradient(135deg, var(--acc), var(--acc-2)); border: 0; box-shadow: var(--glow); }
.round-btn:active { transform: scale(.94); }
.preset { flex: 1; min-height: 76px; border-radius: 18px; background: var(--surface); border: 1.5px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.preset[aria-pressed="true"] { border-color: var(--acc); background: rgba(var(--acc-rgb), .14); }
.preset b { font-family: var(--display); font-size: 1.3rem; }

/* ----------------------------------------------------------------- sheets */
.sheet-layer { position: absolute; inset: 0; z-index: 80; pointer-events: none; }
.sheet-layer > * { pointer-events: auto; }
.scrim { position: absolute; inset: 0; z-index: 70; background: rgba(4, 7, 18, .62); animation: fade .25s ease both; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 71; max-height: 92%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--sheet); border-radius: 28px 28px 0 0; border: 1px solid var(--line-2); border-bottom: 0;
  padding: 10px 18px calc(env(safe-area-inset-bottom, 0px) + 22px); animation: sheetup .38s var(--ease) both;
  box-shadow: 0 -20px 60px -20px rgba(0, 0, 0, .6);
}
@container app (min-width: 720px) { .sheet { left: 50%; right: auto; width: 560px; transform: translateX(-50%); bottom: 24px; border-radius: 28px; border-bottom: 1px solid var(--line-2); max-height: calc(100% - 48px); animation: sheetpop .3s var(--ease) both; } }
@keyframes sheetup { from { transform: translateY(100%); } to { transform: none; } }
@keyframes sheetpop { from { transform: translate(-50%, 30px); opacity: 0; } to { transform: translateX(-50%); opacity: 1; } }
@container app (min-width: 760px) { .sheet.wide { width: 720px; } }
.sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line-2); margin: 0 auto 12px; }
.sheet h2 { font-size: 1.35rem; font-weight: 800; }
.sheet-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.full { position: absolute; inset: 0; z-index: 65; background: var(--bg); overflow-y: auto; animation: slidein .32s var(--ease) both; }
@keyframes slidein { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }

/* toast and undo bar */
.toast {
  position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); z-index: 95; transform: translateX(-50%);
  display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 18px; border-radius: 18px; min-height: 56px; width: max-content; max-width: calc(100% - 32px);
  background: #1A2347; color: #F3F6FF; font-weight: 700; box-shadow: 0 20px 40px -12px rgba(0, 0, 0, .7); animation: toastin .35s var(--ease) both;
}
.st-root[data-theme="light"] .toast { background: #0E1430; }
.toast .btn { min-height: 40px; color: #0E1430; background: #fff; }
@keyframes toastin { from { transform: translate(-50%, 20px); opacity: 0; } to { transform: translateX(-50%); opacity: 1; } }
.netbar { position: absolute; top: 0; left: 0; right: 0; z-index: 80; padding: calc(env(safe-area-inset-top, 0px) + 6px) 14px 6px; text-align: center; font-size: .8rem; font-weight: 800; background: var(--amber); color: #2A1B00; }

/* ------------------------------------------------------- celebrations */
.celebrate { position: absolute; inset: 0; z-index: 100; display: grid; place-items: center; padding: 24px; text-align: center; background: radial-gradient(circle at 50% 42%, rgba(var(--acc-rgb), .55), rgba(5, 8, 20, .94) 62%); animation: fade .35s ease both; }
.celebrate .burst { position: relative; display: grid; place-items: center; width: 210px; height: 210px; margin: 0 auto; }
.celebrate .burst::before { content: ''; position: absolute; inset: -30px; border-radius: 50%; background: conic-gradient(from 0deg, transparent, rgba(255, 210, 94, .35), transparent 30%, rgba(var(--acc-rgb), .45), transparent 60%, rgba(255, 255, 255, .25), transparent 85%); animation: spin 6s linear infinite; filter: blur(2px); }
@keyframes spin { to { transform: rotate(360deg); } }
.celebrate .lvl { position: relative; font-family: var(--display); font-weight: 800; font-size: 6rem; line-height: 1; color: #fff; text-shadow: 0 0 40px rgba(var(--acc-rgb), .9); animation: pop .7s var(--ease) both .15s; }
.celebrate h2 { color: #fff; font-size: 2rem; margin-top: 18px; animation: rise .6s var(--ease) both .35s; }
.celebrate p { color: #D7DEF5; font-weight: 600; margin-top: 8px; animation: rise .6s var(--ease) both .45s; }
.celebrate .eyebrow { color: #FFD25E; }
.confetti-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 110; }

/* badges */
.badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 12px; }
.badge { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: .78rem; font-weight: 800; padding: 8px 2px; border-radius: 16px; }
.badge .medal { width: 70px; height: 70px; }
.badge.locked .medal { filter: grayscale(1) opacity(.32); }
.badge.locked { color: var(--ink-3); }

/* charts */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--ink-3); font-family: var(--body); font-size: 11px; font-weight: 700; }
.chart .grid { stroke: var(--line); }
.bars-h { display: grid; gap: 10px; }
.bars-h .bh { display: grid; grid-template-columns: minmax(80px, 34%) 1fr auto; gap: 10px; align-items: center; font-size: .875rem; font-weight: 700; }
.bars-h .bh .bar { height: 12px; }

/* CAO */
.cao-row { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.cao-row:first-child { border-top: 0; }
.cao-row.counted .cao-name::after { content: 'counts'; margin-left: 8px; font-size: .66rem; font-weight: 800; padding: 2px 7px; border-radius: 999px; background: rgba(var(--acc-rgb), .16); color: var(--acc-text); vertical-align: 2px; }
.cao-row .range { grid-column: 1 / -1; }
.grade-pill { min-width: 48px; text-align: center; font-family: var(--display); font-weight: 800; padding: 4px 10px; border-radius: 10px; background: var(--surface-2); }
.win-card { background: linear-gradient(140deg, rgba(255, 210, 94, .2), rgba(255, 138, 61, .08)), var(--surface); border-color: rgba(255, 210, 94, .35); }

/* past papers grid */
.pp-wrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
.pp-grid { border-collapse: separate; border-spacing: 5px; }
.pp-grid th { font-size: .72rem; color: var(--ink-3); font-weight: 800; text-align: center; padding: 0 2px; }
.pp-cell { width: 54px; height: 44px; border-radius: 12px; background: var(--surface-2); border: 1.5px solid var(--line); font-weight: 800; font-size: .8rem; display: grid; place-items: center; }
.pp-cell.done { background: var(--green-soft); border-color: var(--green); color: var(--green); }

/* AAC */
.aac-ms { display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.aac-ms:first-child { border-top: 0; }
.aac-node { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--line-2); display: grid; place-items: center; }
.aac-node.done { background: var(--green); border-color: var(--green); color: #fff; }
.due { font-weight: 800; font-size: .78rem; padding: 3px 9px; border-radius: 999px; }
.due.calm { background: var(--surface-2); color: var(--ink-2); }
.due.soon { background: var(--amber-soft); color: var(--amber); }
.due.urgent { background: var(--red-soft); color: var(--red); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 92, 92, .0); } 50% { box-shadow: 0 0 0 6px rgba(255, 92, 92, .18); } }

/* flashcards */
.flip { perspective: 1200px; width: 100%; }
.flip-inner { position: relative; width: 100%; min-height: 300px; transition: transform .6s var(--ease); transform-style: preserve-3d; }
.flip.flipped .flip-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 26px; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; border: 1px solid var(--line-2); background: linear-gradient(160deg, var(--surface-2), var(--surface)); box-shadow: var(--shadow); }
.face.back { transform: rotateY(180deg); background: linear-gradient(160deg, rgba(var(--acc-rgb), .25), var(--surface)); }
.face .q { font-family: var(--display); font-size: 1.45rem; font-weight: 800; line-height: 1.25; }
.face img { max-width: 100%; max-height: 150px; border-radius: 12px; }
.leitner { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.leitner div { border-radius: 12px; background: var(--surface-2); padding: 8px 4px; text-align: center; }
.leitner b { display: block; font-family: var(--display); font-size: 1.2rem; }

/* quick check swipe */
.qc-card { position: relative; min-height: 250px; border-radius: 26px; padding: 22px; display: flex; flex-direction: column; justify-content: space-between; background: linear-gradient(160deg, var(--surface-2), var(--surface)); border: 1px solid var(--line-2); box-shadow: var(--shadow); touch-action: pan-y; }
.qc-card .q { font-family: var(--display); font-size: 1.6rem; font-weight: 800; line-height: 1.2; }

/* wizard */
.wiz { position: absolute; inset: 0; z-index: 64; background: var(--bg); display: flex; flex-direction: column; }
.wiz-top { padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 8px; display: flex; align-items: center; gap: 12px; }
.wiz-steps { display: flex; gap: 5px; flex: 1; }
.wiz-steps i { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-3); transition: background .3s; }
.wiz-steps i.on { background: linear-gradient(90deg, var(--acc), var(--acc-2)); }
.wiz-body { flex: 1; overflow-y: auto; padding: 8px 18px 20px; }
.wiz-body h1 { font-size: 1.85rem; font-weight: 800; line-height: 1.15; margin: 10px 0 6px; }
.wiz-foot { padding: 12px 18px calc(env(safe-area-inset-bottom, 0px) + 16px); display: flex; gap: 10px; border-top: 1px solid var(--line); background: var(--bg); }
.sub-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.sub-tile { position: relative; min-height: 96px; border-radius: 18px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; text-align: left; background: var(--surface); border: 2px solid var(--line); font-weight: 800; font-size: .8rem; line-height: 1.2; transition: transform .15s var(--ease), border-color .2s, background .2s; }
.sub-tile:active { transform: scale(.96); }
.sub-tile[aria-pressed="true"] { border-color: var(--tile, var(--acc)); background: color-mix(in srgb, var(--tile, var(--acc)) 18%, transparent); }
.sub-tile .tick-mark { position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border-radius: 50%; background: var(--tile, var(--acc)); color: #fff; display: grid; place-items: center; }
.accent-swatch { width: 54px; height: 54px; border-radius: 50%; border: 3px solid transparent; transition: transform .15s var(--ease); }
.accent-swatch[aria-pressed="true"] { border-color: var(--ink); transform: scale(1.08); }

/* PIN pad */
.pin-dots { display: flex; justify-content: center; gap: 14px; margin: 18px 0 8px; }
.pin-dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line-2); transition: background .15s, transform .15s var(--ease); }
.pin-dots i.on { background: var(--acc); border-color: var(--acc); transform: scale(1.12); }
.pin-dots.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.pinpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 320px; margin: 0 auto; }
.pinpad button { min-height: 66px; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); font-family: var(--display); font-size: 1.6rem; font-weight: 800; transition: transform .1s, background .2s; }
.pinpad button:active { transform: scale(.94); background: var(--surface-3); }
.pinpad button.txt { font-size: .95rem; background: transparent; border-color: transparent; }

/* login */
.login { position: absolute; inset: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: calc(env(safe-area-inset-top, 0px) + 28px) 20px calc(env(safe-area-inset-bottom, 0px) + 24px); }
.login-card { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 1; }
.wordmark { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 1.6rem; letter-spacing: -.03em; }
.wordmark b { background: linear-gradient(120deg, var(--acc), var(--acc-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.footer-credit { text-align: center; font-size: .78rem; color: var(--ink-3); padding: 18px 0 6px; font-weight: 600; }
.footer-credit a { color: var(--ink-2); font-weight: 800; text-decoration: none; }

/* messages */
.msg { max-width: 86%; padding: 12px 14px; border-radius: 18px; font-weight: 600; line-height: 1.4; position: relative; }
.msg.in { background: var(--surface-2); border-bottom-left-radius: 6px; align-self: flex-start; }
.msg.out { background: linear-gradient(140deg, var(--acc), var(--acc-2)); color: var(--acc-ink); border-bottom-right-radius: 6px; align-self: flex-end; }
.msg .react { position: absolute; bottom: -12px; right: 10px; background: var(--raise); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; font-size: .95rem; }
.emoji-row { display: flex; gap: 6px; }
.emoji-row button { width: 44px; height: 44px; border-radius: 14px; background: var(--surface-2); font-size: 1.3rem; }

/* wellbeing */
.scale5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.scale5 button { min-height: 52px; border-radius: 14px; background: var(--surface-2); border: 2px solid transparent; font-family: var(--display); font-weight: 800; font-size: 1.1rem; }
.scale5 button[aria-pressed="true"] { border-color: var(--acc); background: rgba(var(--acc-rgb), .18); }
.kind { background: linear-gradient(140deg, rgba(124, 92, 255, .22), rgba(0, 194, 255, .1)), var(--surface); border-color: rgba(124, 92, 255, .4); }

/* rewards */
.reward { display: grid; grid-template-columns: 52px 1fr; gap: 14px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
.reward:first-child { border-top: 0; }
.gift { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: linear-gradient(140deg, #FFD25E, #FF8A3D); color: #3A1D00; }
.gift.locked { background: var(--surface-2); color: var(--ink-3); }
.team-meter { position: relative; height: 22px; border-radius: 999px; background: var(--surface-3); overflow: hidden; display: flex; }
.team-meter i { height: 100%; transition: width 1.4s var(--ease); }

/* ---------------------------------------------------------- parent app
   Section 6.0 of the brief: 18px body text, 56px buttons, plain words. */
.st-root.parent { font-size: 1.125rem; line-height: 1.5; }
.st-root.parent .st-scroll { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 40px); }
.st-root.parent .btn { min-height: 56px; font-size: 1.0625rem; }
.st-root.parent .btn.sm { min-height: 48px; }
.st-root.parent .tiny { font-size: .875rem; }
.st-root.parent .small { font-size: 1rem; }
.st-root.parent .muted { color: var(--ink-2); }
.st-root.parent .card { padding: 20px; border-radius: 24px; }
.st-root.parent .input, .st-root.parent .select, .st-root.parent .textarea { min-height: 58px; font-size: 1.125rem; }
.child-card { border-top: 6px solid var(--child, var(--acc)); }
@container app (min-width: 900px) { .kids-grid { grid-template-columns: 1fr 1fr; align-items: start; } }
.child-head { display: flex; align-items: center; gap: 14px; }
.child-head .avatar { background: var(--child); box-shadow: none; }
.plain { font-size: 1.25rem; font-weight: 700; line-height: 1.4; }
.plain-2 { font-size: 1.0625rem; font-weight: 600; line-height: 1.45; color: var(--ink-2); }
.big-action { display: flex; align-items: center; gap: 16px; width: 100%; min-height: 72px; padding: 0 20px; border-radius: 22px; font-family: var(--display); font-weight: 800; font-size: 1.2rem; text-align: left; background: var(--surface); border: 2px solid var(--line-2); color: var(--ink); box-shadow: var(--shadow); }
.big-action .bi { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; flex: none; color: #fff; background: linear-gradient(140deg, var(--acc), var(--acc-2)); }
.big-action:active { transform: scale(.985); }
.explain { display: inline-flex; align-items: center; gap: 6px; font-size: .95rem; font-weight: 700; color: var(--acc-text); text-decoration: underline; text-underline-offset: 3px; min-height: 40px; }
.pnum { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.pnum .cell { background: var(--surface-2); border-radius: 18px; padding: 14px; }
.pnum .cell .v { font-family: var(--display); font-weight: 800; font-size: 1.6rem; line-height: 1.1; }
.pnum .cell .l { font-size: .95rem; font-weight: 600; color: var(--ink-2); }
.date-row { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.date-row:first-child { border-top: 0; }
.date-chip { border-radius: 16px; background: var(--surface-2); text-align: center; padding: 8px 4px; }
.date-chip b { display: block; font-family: var(--display); font-size: 1.5rem; line-height: 1; }
.date-chip span { font-size: .8rem; font-weight: 800; text-transform: uppercase; color: var(--ink-3); }
.flow { position: absolute; inset: 0; z-index: 66; background: var(--bg); display: flex; flex-direction: column; animation: slidein .3s var(--ease) both; }
.flow-top { padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 6px; }
.flow-body { flex: 1; overflow-y: auto; padding: 8px 18px 24px; }
.flow-body h1 { font-size: 1.75rem; font-weight: 800; line-height: 1.2; margin: 8px 0 18px; }
.flow-foot { padding: 12px 18px calc(env(safe-area-inset-bottom, 0px) + 16px); display: grid; grid-template-columns: 1fr 2fr; gap: 12px; border-top: 1px solid var(--line); background: var(--bg); }
.choice { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 12px 18px; border-radius: 20px; background: var(--surface); border: 2px solid var(--line-2); font-weight: 700; font-size: 1.125rem; text-align: left; }
.choice[aria-pressed="true"] { border-color: var(--acc); background: rgba(var(--acc-rgb), .12); }
.choice .radio { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid var(--line-2); flex: none; display: grid; place-items: center; }
.choice[aria-pressed="true"] .radio { border-color: var(--acc); }
.choice[aria-pressed="true"] .radio::after { content: ''; width: 13px; height: 13px; border-radius: 50%; background: var(--acc); }
.choices { display: flex; flex-direction: column; gap: 10px; }
.tour { position: absolute; inset: 0; z-index: 98; background: rgba(4, 7, 18, .7); display: flex; align-items: flex-end; justify-content: center; padding: 18px; animation: fade .3s both; }
.tour-card { width: 100%; max-width: 460px; background: var(--sheet); color: var(--ink); border-radius: 28px; padding: 26px 22px 20px; animation: rise .45s var(--ease) both; }
.tour-card .n { font-weight: 800; color: var(--acc-text); font-size: .95rem; }
.tour-card h2 { font-size: 1.6rem; margin: 6px 0 10px; }

/* admin */
.st-root.admin .st-page { max-width: 1120px; }
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: .875rem; }
.table th, .table td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table th { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.code-box { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: .82rem; }
.reveal-code { font-family: var(--display); font-size: 2.6rem; font-weight: 800; letter-spacing: .12em; text-align: center; padding: 16px; border-radius: 18px; background: rgba(var(--acc-rgb), .14); }

/* reduced motion: final values, no confetti, no movement */
@media (prefers-reduced-motion: reduce) {
  .st-root *, .st-root *::before, .st-root *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; scroll-behavior: auto !important; }
}
.st-root.calm .rise { animation-duration: .45s; }



html,body{background:#F3F5FB}
